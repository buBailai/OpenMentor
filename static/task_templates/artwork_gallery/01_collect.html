<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品实时采集 · OpenMentor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --om-cream:        #F0EEE6;
      --om-cream-soft:   #F7F4EC;
      --om-cream-warm:   #E8E4D8;
      --om-paper:        #FFFFFF;
      --om-ink:          #141413;
      --om-ink-soft:     #2D2A24;
      --om-muted:        #6B6760;
      --om-subtle:       #94918B;
      --om-border:       #E5E0D8;
      --om-border-strong:#C9C3B8;
      --om-divider:      #EDE8DD;
      --om-clay:         #D97757;
      --om-clay-hover:   #C56548;
      --om-clay-soft:    #F5E6DD;
      --om-clay-deep:    #A04D38;
      --om-success:      #5B7553;
      --om-success-soft: #E5EBDF;
      --om-danger:       #C0584A;
      --om-font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
      --om-font-serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', serif;
      --om-radius-sm: 6px;
      --om-radius:    10px;
      --om-radius-lg: 14px;
      --om-radius-xl: 20px;
      --om-shadow-sm: 0 1px 3px rgba(20, 17, 12, 0.05);
      --om-shadow-md: 0 4px 16px rgba(20, 17, 12, 0.06);
      --om-shadow-lg: 0 12px 40px rgba(20, 17, 12, 0.10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--om-cream-soft);
      background-image: radial-gradient(circle at 20% 0%, rgba(217, 119, 87, 0.06), transparent 45%),
                        radial-gradient(circle at 100% 100%, rgba(217, 119, 87, 0.05), transparent 40%);
      font-family: var(--om-font-sans);
      color: var(--om-ink);
      padding: 24px;
      line-height: 1.6;
    }
    .card {
      background: var(--om-paper);
      width: 100%;
      max-width: 460px;
      border: 1px solid var(--om-border);
      border-radius: var(--om-radius-xl);
      box-shadow: var(--om-shadow-lg);
      padding: 40px 38px 34px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 26px;
    }
    .brand-mark {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: var(--om-clay);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: var(--om-font-serif);
      font-weight: 600;
      font-size: 15px;
      line-height: 1;
    }
    .brand-name {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .2px;
      color: var(--om-ink-soft);
    }
    h1 {
      margin: 0 0 6px;
      font-family: var(--om-font-serif);
      font-size: 27px;
      font-weight: 600;
      letter-spacing: .5px;
      color: var(--om-ink);
    }
    .subtitle {
      margin: 0 0 30px;
      color: var(--om-muted);
      font-size: 14.5px;
    }
    label {
      display: block;
      margin-bottom: 9px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--om-ink-soft);
    }
    .field { margin-bottom: 24px; }
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--om-border-strong);
      border-radius: var(--om-radius);
      font-family: var(--om-font-sans);
      font-size: 15px;
      color: var(--om-ink);
      background: var(--om-cream-soft);
      transition: border-color .18s, box-shadow .18s, background .18s;
    }
    input[type="text"]::placeholder { color: var(--om-subtle); }
    input[type="text"]:focus {
      outline: none;
      background: var(--om-paper);
      border-color: var(--om-clay);
      box-shadow: 0 0 0 3px var(--om-clay-soft);
    }
    .file-drop {
      position: relative;
      border: 1.5px dashed var(--om-border-strong);
      border-radius: var(--om-radius);
      padding: 24px 18px;
      text-align: center;
      color: var(--om-muted);
      cursor: pointer;
      background: var(--om-cream-soft);
      transition: border-color .18s, background .18s;
    }
    .file-drop:hover {
      border-color: var(--om-clay);
      background: var(--om-clay-soft);
    }
    .file-drop .hint { font-size: 14px; }
    .file-drop .sub  { font-size: 12px; color: var(--om-subtle); margin-top: 4px; }
    .file-drop input[type="file"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .file-name {
      margin-top: 12px;
      font-size: 13px;
      color: var(--om-clay-deep);
      font-weight: 500;
      word-break: break-all;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 4px;
      border: none;
      border-radius: var(--om-radius);
      background: var(--om-clay);
      color: #fff;
      font-family: var(--om-font-sans);
      font-size: 15.5px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--om-shadow-sm);
      transition: background .18s, transform .08s;
    }
    button:hover { background: var(--om-clay-hover); }
    button:active { transform: translateY(1px); }
    button:disabled { background: var(--om-border-strong); cursor: not-allowed; box-shadow: none; }
    .msg {
      margin-top: 18px;
      text-align: center;
      font-size: 13.5px;
      min-height: 20px;
    }
    .msg.ok  { color: var(--om-success); }
    .msg.err { color: var(--om-danger); }
    .foot {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--om-divider);
      text-align: center;
      font-size: 12px;
      color: var(--om-subtle);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <span class="brand-mark">M</span>
      <span class="brand-name">OpenMentor</span>
    </div>

    <h1>作品实时采集</h1>
    <p class="subtitle">填写姓名 / 小组并上传你的作品附件</p>

    <form id="collectForm" method="POST" enctype="multipart/form-data">
      <div class="field">
        <label for="name">姓名 / 小组</label>
        <input type="text" id="name" name="name" placeholder="请输入姓名或小组名称" required>
      </div>

      <div class="field">
        <label>作品附件</label>
        <div class="file-drop" id="fileDrop">
          <div class="hint">点击或拖拽文件到此处上传</div>
          <div class="sub">支持图片、文档、压缩包等格式</div>
          <input type="file" id="file" name="file" required>
          <div class="file-name" id="fileName"></div>
        </div>
      </div>

      <button type="submit" id="submitBtn">提交作品</button>
      <div class="msg" id="msg"></div>
    </form>

    <div class="foot">由 OpenMentor 提供支持 · 开源 AI 导师</div>
  </div>

  <script>
    const TASK_ID = '__OM_TASK_API_ID__';
    const API = window.location.origin + '/api/' + TASK_ID;
    const form = document.getElementById('collectForm');
    const fileInput = document.getElementById('file');
    const fileName = document.getElementById('fileName');
    const msg = document.getElementById('msg');
    const submitBtn = document.getElementById('submitBtn');

    fileInput.addEventListener('change', () => {
      fileName.textContent = fileInput.files.length ? '已选择：' + fileInput.files[0].name : '';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      msg.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = '提交中…';

      try {
        // 用表单构造 FormData，浏览器会自动带上正确的 multipart 边界，切勿手动设置 Content-Type
        const formData = new FormData(form);
        const res = await fetch(API, {
          method: 'POST',
          body: formData
        });

        if (res.ok) {
          msg.className = 'msg ok';
          msg.textContent = '提交成功，感谢你的作品！';
          form.reset();
          fileName.textContent = '';
        } else {
          msg.className = 'msg err';
          msg.textContent = '提交失败（状态码 ' + res.status + '）';
        }
      } catch (err) {
        msg.className = 'msg err';
        msg.textContent = '提交出错：' + err.message;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '提交作品';
      }
    });
  </script>
</body>
</html>
